name: Verify quantum systems workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: researchos-systems validate examples/synthetic-system.json
      - run: researchos-systems run examples/synthetic-system.json --output runs/demo
      - run: researchos-systems verify runs/demo
      - run: researchos-systems report runs/demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-system-python-${{ matrix.python }}
          path: runs/demo/
